<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ title | e }}</title>

        <!-- Google Fonts: Lusitana (serif) -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lusitana:wght@400;700&display=swap">

        {{ bokeh_css }}
        {{ bokeh_js }}

        <style>
            *, *::before, *::after {
                box-sizing: border-box;
            }

            html, body {
                background-color: #FDFCF7 !important;
                font-family: 'Lusitana', Georgia, serif !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                min-height: 100vh !important;
                text-align: center;
            }

            /* Page: a single centered column. */
            body {
                display: flex !important;
                flex-direction: column !important;
                align-items: center !important;
                padding: 20px 0 !important;
            }

            /* Bokeh root: full-width flex row whose only child (the fixed-width
               presentation column from main.py) is centered horizontally. */
            .bk-root {
                display: flex !important;
                justify-content: center !important;
                width: 100% !important;
                background-color: transparent !important;
            }

            .bk-root input,
            .bk-root select,
            .bk-root button,
            .bk-root textarea {
                font-family: 'Lusitana', Georgia, serif !important;
            }
        </style>
    </head>
    <body>
        {{ plot_div }}
        {{ plot_script }}
    </body>
</html>
